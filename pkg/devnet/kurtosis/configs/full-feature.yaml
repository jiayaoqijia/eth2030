participants:
  - el_type: geth
    el_image: eth2030:local
    el_log_level: debug
    el_extra_params: ["--rpc.rate_limit=0"]
    cl_type: lighthouse
    cl_log_level: debug
    cl_image: eth2030cl:local
    # --subscribe-all-subnets ensures all nodes stay subscribed to all gossip topics.
    # count: 3 forms a triangle gossip mesh — if any pair temporarily disconnects
    # at the Fulu sync_committee deadline (slot 40 = epoch 1 slot 8), the third
    # node provides an alternative path for attestation propagation, enabling
    # reliable reconnection and finalization.
    cl_extra_params: ["--subscribe-all-subnets"]
    count: 3

network_params:
  network: kurtosis
  seconds_per_slot: 12
  genesis_delay: 30
  # Fork schedule:
  # - fulu_fork_epoch: 1 → Fulu (PeerDAS) starts at epoch 1 (slot 32)
  # - gloas_fork_epoch: 2 → Gloas (ePBS/EIP-7732) starts at epoch 2 (slot 64)
  # - heze_fork_epoch: 3 → Heze (FOCIL/EIP-7805) starts at epoch 3 (slot 96)
  # Note: Spacing forks by 1 epoch ensures gossip topics are properly initialized.
  fulu_fork_epoch: 1
  gloas_fork_epoch: 2
  heze_fork_epoch: 3

additional_services:
  - dora
  - spamoor
  - rakoon
  - blockscout
  - prometheus
  - grafana
  - checkpointz

dora_params:
  image: "eth2030/dora:v0.0.1"

spamoor_params:
  image: eth2030/spamoor:v0.0.1
  # Resource management for spamoor
  # CPU is milicores
  # RAM is in MB
  min_cpu: 5
  max_cpu: 30
  min_mem: 20
  max_mem: 300
  spammers:
    - scenario: eoatx
      name: "EOA Transfers"
      config:
        throughput: 6
        max_pending: 12
        max_wallets: 12
        random_target: true
        tip_fee: 2
    - scenario: erc20tx
      name: "ERC20 Token Transfers"
      config:
        throughput: 4
        max_pending: 10
        max_wallets: 10
        random_target: true
        tip_fee: 2
    - scenario: erc721tx
      name: "ERC721 NFT Transfers"
      config:
        throughput: 2
        max_pending: 6
        max_wallets: 6
        tip_fee: 2
    - scenario: erc1155tx
      name: "ERC1155 Multi-Token"
      config:
        throughput: 2
        max_pending: 6
        max_wallets: 6
        tip_fee: 2
    - scenario: setcodetx
      name: "EIP-7702 SetCode"
      config:
        throughput: 2
        max_pending: 6
        max_wallets: 8
        # Use min = max for deterministic auth count (reference pattern).
        min_authorizations: 5
        max_authorizations: 5
        # max_delegators caps unique delegator accounts to limit state growth.
        # Without it every tx creates fresh delegators (unbounded state bloat).
        max_delegators: 100
        # Gas formula: 21000 + 5*(12500+25000) = 208500 (all empty delegators).
        # Use 300000 for headroom.
        gas_limit: 300000
        random_code_addr: true
        random_target: true
        tip_fee: 2
    - scenario: aatx
      name: "EIP-7701 Native AA Raw"
      config:
        submit_mode: raw_tx
        throughput: 1
        max_pending: 4
        max_wallets: 6
        sender_validation_gas: 50000
        sender_execution_gas: 21000
        sender_execution_data: "0x"
        tip_fee: 2
    - scenario: aatx
      name: "EIP-7701 Native AA UserOp"
      config:
        submit_mode: user_operation
        throughput: 1
        max_pending: 4
        max_wallets: 6
        sender_validation_gas: 50000
        sender_execution_gas: 21000
        sender_execution_data: "0x"
        tip_fee: 2
    # EIP-8141 Frame Transactions - auto-deploys verifier contract
    - scenario: frametx
      name: "EIP-8141 Simple FrameTx"
      config:
        tx_pattern: simple
        throughput: 1
        max_pending: 4
        max_wallets: 6
        verify_gas: 50000
        execution_gas: 21000
        tip_fee: 2
    - scenario: frametx
      name: "EIP-8141 Transfer FrameTx"
      config:
        tx_pattern: transfer
        throughput: 1
        max_pending: 4
        max_wallets: 6
        verify_gas: 50000
        execution_gas: 50000
        tip_fee: 2
    - scenario: frametx
      name: "EIP-8141 Deploy FrameTx"
      config:
        tx_pattern: deploy
        throughput: 1
        max_pending: 4
        max_wallets: 6
        verify_gas: 50000
        execution_gas: 50000
        deploy_gas: 100000
        tip_fee: 2
    - scenario: frametx
      name: "EIP-8141 Sponsored FrameTx"
      config:
        tx_pattern: sponsored
        throughput: 1
        max_pending: 4
        max_wallets: 6
        verify_gas: 50000
        payer_verify_gas: 30000
        execution_gas: 50000
        tip_fee: 2
    - scenario: blobs
      name: "EIP-4844 Blob Transactions"
      config:
        throughput: 1
        max_pending: 3
        max_wallets: 4
        sidecars: 1
        tip_fee: 2
    - scenario: gasburnertx
      name: "Gas Burner"
      config:
        throughput: 1
        max_pending: 3
        max_wallets: 4
        tip_fee: 2
        # Use 2M gas per tx (scenario default) to keep wallet funding affordable.
        gas_units_to_burn: 500000
    - scenario: storagespam
      name: "Storage Spam"
      config:
        throughput: 1
        max_pending: 3
        max_wallets: 4
        tip_fee: 2
        gas_units_to_burn: 500000

rakoon_params:
  tx_type: eip7702
  workers: 10
  fuzzing: true
