name: CI

on:
  push:
    branches: [master]
    paths:
      - 'pkg/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'pkg/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Vet, Lint, Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: pkg/go.sum

      - name: gofmt
        working-directory: pkg
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: pkg
        run: go vet ./...

      - name: Build + Test
        working-directory: pkg
        run: go test ./... -timeout=15m -count=1
        env:
          GOFLAGS: '-p=4'
